
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Productivity Agent | Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
        }

        .container {
            width: 100%;
            max-width: 430px;
            background: #ffffff;
            padding: 35px;
            border-radius: 18px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header h1 {
            color: #5b4bdb;
            font-size: 27px;
            margin-bottom: 8px;
        }

        .header p {
            color: #777;
            font-size: 14px;
        }

        .form-title {
            text-align: center;
            font-size: 22px;
            color: #222;
            margin-bottom: 22px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
            font-weight: bold;
            color: #333;
        }

        .form-group input {
            width: 100%;
            padding: 13px;
            border: 1px solid #d5d5d5;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }

        .form-group input:focus {
            border-color: #6c5ce7;
            box-shadow: 0 0 0 2px rgba(108, 92, 231, 0.12);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            margin-top: 5px;
            border: none;
            border-radius: 8px;
            background: #6c5ce7;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .submit-btn:hover {
            background: #5848d5;
        }

        .submit-btn:disabled {
            opacity: 0.65;
            cursor: not-allowed;
        }

        .switch-text {
            margin-top: 20px;
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .switch-text button {
            border: none;
            background: none;
            color: #6c5ce7;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }

        .message {
            display: none;
            padding: 11px;
            margin-bottom: 15px;
            border-radius: 7px;
            font-size: 14px;
            line-height: 1.4;
            overflow-wrap: anywhere;
        }

        .message.error {
            display: block;
            background: #ffe8e8;
            color: #b42318;
        }

        .message.success {
            display: block;
            background: #e5f8ec;
            color: #187a3e;
        }

        .footer {
            margin-top: 25px;
            text-align: center;
            color: #999;
            font-size: 12px;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1>🤖 AI Productivity Agent</h1>
            <p>Your personal smart productivity assistant</p>
        </div>

        <!-- LOGIN FORM -->
        <form id="loginForm">

            <h2 class="form-title">Welcome Back 👋</h2>

            <div id="loginMessage" class="message"></div>

            <div class="form-group">
                <label for="loginEmail">Email</label>
                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="loginPassword">Password</label>
                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                    required
                >
            </div>

            <button type="submit" id="loginBtn" class="submit-btn">
                🔐 Login
            </button>

            <p class="switch-text">
                Don't have an account?
                <button type="button" id="showSignup">
                    Create Account
                </button>
            </p>

        </form>

        <!-- SIGNUP FORM -->
        <form id="signupForm" class="hidden">

            <h2 class="form-title">Create Account ✨</h2>

            <div id="signupMessage" class="message"></div>

            <div class="form-group">
                <label for="signupName">Full Name</label>
                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupEmail">Email</label>
                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >
            </div>

            <div class="form-group">
                <label for="signupPassword">Password</label>
                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Create a password (minimum 6 characters)"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >
            </div>

            <button type="submit" id="signupBtn" class="submit-btn">
                ✨ Create Account
            </button>

            <p class="switch-text">
                Already have an account?
                <button type="button" id="showLogin">
                    Login
                </button>
            </p>

        </form>

        <div class="footer">
            Secure multi-user productivity system
        </div>

    </div>

    <script>
        // RENDER BACKEND URL
        const API_URL = "https://ai-productivity-agent.onrender.com";

        const loginForm = document.getElementById("loginForm");
        const signupForm = document.getElementById("signupForm");

        const loginBtn = document.getElementById("loginBtn");
        const signupBtn = document.getElementById("signupBtn");

        // SHOW MESSAGE
        function showMessage(elementId, message, type) {
            const element = document.getElementById(elementId);

            element.textContent = message;
            element.className = "message " + type;
        }

        // CLEAR MESSAGE
        function clearMessage(elementId) {
            const element = document.getElementById(elementId);

            element.textContent = "";
            element.className = "message";
        }

        // SWITCH TO SIGNUP
        document.getElementById("showSignup").addEventListener("click", function () {
            loginForm.classList.add("hidden");
            signupForm.classList.remove("hidden");

            clearMessage("loginMessage");
            clearMessage("signupMessage");
        });

        // SWITCH TO LOGIN
        document.getElementById("showLogin").addEventListener("click", function () {
            signupForm.classList.add("hidden");
            loginForm.classList.remove("hidden");

            clearMessage("loginMessage");
            clearMessage("signupMessage");
        });

        // BACKEND REQUEST HELPER
        async function sendRequest(endpoint, payload) {
            const response = await fetch(`${API_URL}${endpoint}`, {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                credentials: "include",

                body: JSON.stringify(payload)
            });

            // Read response safely
            const responseText = await response.text();

            let data;

            try {
                data = JSON.parse(responseText);
            } catch {
                throw new Error(
                    "The backend returned an invalid response. Please try again."
                );
            }

            return {
                response: response,
                data: data
            };
        }

        // LOGIN
        loginForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            clearMessage("loginMessage");

            const email = document.getElementById("loginEmail").value.trim();
            const password = document.getElementById("loginPassword").value;

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";

            try {
                const result = await sendRequest("/login", {
                    email: email,
                    password: password
                });

                const response = result.response;
                const data = result.data;

                if (!response.ok || !data.success) {
                    showMessage(
                        "loginMessage",
                        data.message || "Login failed. Please check your details.",
                        "error"
                    );

                    return;
                }

                showMessage(
                    "loginMessage",
                    "Login successful! Opening dashboard...",
                    "success"
                );

                setTimeout(function () {
                    window.location.href = "index.html";
                }, 700);

            } catch (error) {
                console.error("Login error:", error);

                showMessage(
                    "loginMessage",
                    "Unable to connect to the backend. Please check the Render service or try again.",
                    "error"
                );

            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = "🔐 Login";
            }
        });

        // SIGNUP
        signupForm.addEventListener("submit", async function (event) {
            event.preventDefault();

            clearMessage("signupMessage");

            const name = document.getElementById("signupName").value.trim();
            const email = document.getElementById("signupEmail").value.trim();
            const password = document.getElementById("signupPassword").value;
            const confirmPassword = document.getElementById("confirmPassword").value;

            if (password.length < 6) {
                showMessage(
                    "signupMessage",
                    "Password must contain at least 6 characters.",
                    "error"
                );
                return;
            }

            if (password !== confirmPassword) {
                showMessage(
                    "signupMessage",
                    "Passwords do not match.",
                    "error"
                );
                return;
            }

            signupBtn.disabled = true;
            signupBtn.textContent = "Creating account...";

            try {
                const result = await sendRequest("/signup", {
                    name: name,
                    email: email,
                    password: password
                });

                const response = result.response;
                const data = result.data;

                if (!response.ok || !data.success) {
                    showMessage(
                        "signupMessage",
                        data.message || "Account creation failed. Please try again.",
                        "error"
                    );

                    return;
                }

                showMessage(
                    "signupMessage",
                    "Account created successfully! Opening dashboard...",
                    "success"
                );

                // Backend signup automatically logs in the new user
                setTimeout(function () {
                    window.location.href = "index.html";
                }, 700);

            } catch (error) {
                console.error("Signup error:", error);

                showMessage(
                    "signupMessage",
                    "Unable to connect to the backend. Please check the Render service or try again.",
                    "error"
                );

            } finally {
                signupBtn.disabled = false;
                signupBtn.textContent = "✨ Create Account";
            }
        });
    </script>

</body>
</html>
