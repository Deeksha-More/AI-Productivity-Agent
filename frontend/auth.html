<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AI Productivity Agent - Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            background:
                linear-gradient(
                    rgba(226, 238, 244, 0.55),
                    rgba(244, 239, 232, 0.60)
                ),
                url("https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=2000&q=85");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .auth-container {
            width: 420px;
            max-width: 92%;

            padding: 35px;

            border-radius: 25px;

            background: rgba(255, 255, 255, 0.78);

            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.15);

            border: 1px solid rgba(255, 255, 255, 0.7);
        }

        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 8px;
        }

        h1 {
            text-align: center;
            font-size: 27px;
            color: #243746;
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            color: #667781;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .form-title {
            font-size: 21px;
            color: #243746;
            margin-bottom: 18px;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 7px;

            color: #344955;
            font-size: 14px;
            font-weight: 600;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border: 1px solid rgba(100, 120, 130, 0.25);

            border-radius: 12px;

            background: rgba(255, 255, 255, 0.85);

            outline: none;

            font-size: 14px;

            transition: 0.2s;
        }

        input:focus {
            border-color: #6d9ca8;

            box-shadow:
                0 0 0 3px rgba(109, 156, 168, 0.15);
        }

        .auth-button {
            width: 100%;

            border: none;

            padding: 14px;

            border-radius: 13px;

            background: #5d8791;

            color: white;

            font-size: 15px;
            font-weight: 600;

            cursor: pointer;

            margin-top: 5px;

            transition: 0.2s;
        }

        .auth-button:hover {
            background: #4d747d;

            transform: translateY(-1px);
        }

        .switch-text {
            text-align: center;

            margin-top: 20px;

            color: #667781;

            font-size: 14px;
        }

        .switch-button {
            border: none;

            background: none;

            color: #4d7e89;

            font-weight: 700;

            cursor: pointer;

            font-size: 14px;
        }

        .message {
            display: none;

            margin-bottom: 15px;

            padding: 11px 13px;

            border-radius: 10px;

            font-size: 13px;

            text-align: center;
        }

        .message.success {
            display: block;

            background: rgba(80, 160, 100, 0.15);

            color: #286438;
        }

        .message.error {
            display: block;

            background: rgba(200, 70, 70, 0.13);

            color: #8a3030;
        }

        #signupForm {
            display: none;
        }

        .footer {
            text-align: center;

            margin-top: 25px;

            color: #7b898f;

            font-size: 11px;
        }

        @media (max-width: 500px) {
            .auth-container {
                padding: 25px;
            }

            h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="auth-container">

        <div class="logo">
            🤖
        </div>

        <h1>
            AI Productivity Agent
        </h1>

        <p class="subtitle">
            Your personal smart productivity assistant
        </p>


        <!-- ================================================= -->
        <!-- LOGIN -->
        <!-- ================================================= -->

        <div id="loginForm">

            <h2 class="form-title">
                Welcome Back 👋
            </h2>

            <div
                id="loginMessage"
                class="message">
            </div>

            <div class="input-group">

                <label for="loginEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="input-group">

                <label for="loginPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Enter your password"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="auth-button"
                onclick="loginUser()">

                🔐 Login

            </button>


            <p class="switch-text">

                Don't have an account?

                <button
                    class="switch-button"
                    onclick="showSignup()">

                    Create Account

                </button>

            </p>

        </div>


        <!-- ================================================= -->
        <!-- SIGNUP -->
        <!-- ================================================= -->

        <div id="signupForm">

            <h2 class="form-title">
                Create Account ✨
            </h2>

            <div
                id="signupMessage"
                class="message">
            </div>


            <div class="input-group">

                <label for="signupName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="signupName"
                    placeholder="Enter your name"
                    autocomplete="name"
                >

            </div>


            <div class="input-group">

                <label for="signupEmail">
                    Email
                </label>

                <input
                    type="email"
                    id="signupEmail"
                    placeholder="Enter your email"
                    autocomplete="email"
                >

            </div>


            <div class="input-group">

                <label for="signupPassword">
                    Password
                </label>

                <input
                    type="password"
                    id="signupPassword"
                    placeholder="Minimum 6 characters"
                    autocomplete="new-password"
                >

            </div>


            <div class="input-group">

                <label for="signupConfirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="signupConfirmPassword"
                    placeholder="Enter password again"
                    autocomplete="new-password"
                >

            </div>


            <button
                class="auth-button"
                onclick="signupUser()">

                ✨ Create Account

            </button>


            <p class="switch-text">

                Already have an account?

                <button
                    class="switch-button"
                    onclick="showLogin()">

                    Login

                </button>

            </p>

        </div>


        <div class="footer">
            Secure multi-user productivity system
        </div>

    </div>


    <script>

        /* =====================================================
           RENDER BACKEND
           ===================================================== */

        const API_URL =
            "https://ai-productivity-agent.onrender.com";


        /* =====================================================
           SHOW LOGIN
           ===================================================== */

        function showLogin() {

            document.getElementById(
                "loginForm"
            ).style.display = "block";

            document.getElementById(
                "signupForm"
            ).style.display = "none";

            clearMessages();
        }


        /* =====================================================
           SHOW SIGNUP
           ===================================================== */

        function showSignup() {

            document.getElementById(
                "loginForm"
            ).style.display = "none";

            document.getElementById(
                "signupForm"
            ).style.display = "block";

            clearMessages();
        }


        /* =====================================================
           CLEAR MESSAGES
           ===================================================== */

        function clearMessages() {

            const messages = [
                "loginMessage",
                "signupMessage"
            ];

            messages.forEach(id => {

                const element =
                    document.getElementById(id);

                element.textContent = "";

                element.className =
                    "message";

            });
        }


        /* =====================================================
           SHOW MESSAGE
           ===================================================== */

        function showMessage(
            elementId,
            message,
            type
        ) {

            const element =
                document.getElementById(
                    elementId
                );

            element.textContent =
                message;

            element.className =
                "message " + type;
        }


        /* =====================================================
           LOGIN
           ===================================================== */

        async function loginUser() {

            const email =
                document.getElementById(
                    "loginEmail"
                ).value.trim();

            const password =
                document.getElementById(
                    "loginPassword"
                ).value;


            if (!email || !password) {

                showMessage(
                    "loginMessage",
                    "Please enter email and password.",
                    "error"
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/login`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        "loginMessage",
                        data.message ||
                        "Login failed.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "loginMessage",
                    "Login successful! Opening dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }


            catch (error) {

                showMessage(
                    "loginMessage",
                    "Unable to connect to the backend. Please check the Render service.",
                    "error"
                );

            }
        }


        /* =====================================================
           SIGNUP
           ===================================================== */

        async function signupUser() {

            const name =
                document.getElementById(
                    "signupName"
                ).value.trim();

            const email =
                document.getElementById(
                    "signupEmail"
                ).value.trim();

            const password =
                document.getElementById(
                    "signupPassword"
                ).value;

            const confirmPassword =
                document.getElementById(
                    "signupConfirmPassword"
                ).value;


            if (
                !name ||
                !email ||
                !password ||
                !confirmPassword
            ) {

                showMessage(
                    "signupMessage",
                    "Please fill in all fields.",
                    "error"
                );

                return;
            }


            if (password.length < 6) {

                showMessage(
                    "signupMessage",
                    "Password must contain at least 6 characters.",
                    "error"
                );

                return;
            }


            if (
                password !==
                confirmPassword
            ) {

                showMessage(
                    "signupMessage",
                    "Passwords do not match.",
                    "error"
                );

                return;
            }


            try {

                const response =
                    await fetch(
                        `${API_URL}/signup`,
                        {
                            method: "POST",

                            headers: {
                                "Content-Type":
                                    "application/json"
                            },

                            credentials: "include",

                            body: JSON.stringify({
                                name: name,
                                email: email,
                                password: password
                            })
                        }
                    );


                const data =
                    await response.json();


                if (
                    !response.ok ||
                    !data.success
                ) {

                    showMessage(
                        "signupMessage",
                        data.message ||
                        "Account creation failed.",
                        "error"
                    );

                    return;
                }


                showMessage(
                    "signupMessage",
                    "Account created! Opening dashboard...",
                    "success"
                );


                setTimeout(
                    function() {

                        window.location.href =
                            "index.html";

                    },
                    700
                );

            }


            catch (error) {

                showMessage(
                    "signupMessage",
                    "Unable to connect to the backend. Please check the Render service.",
                    "error"
                );

            }
        }


        /* =====================================================
           ENTER KEY SUPPORT
           ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    const loginVisible =
                        document.getElementById(
                            "loginForm"
                        ).style.display !== "none";


                    if (loginVisible) {

                        loginUser();

                    }

                    else {

                        signupUser();

                    }

                }

            }
        );

    </script>

</body>
</html>
